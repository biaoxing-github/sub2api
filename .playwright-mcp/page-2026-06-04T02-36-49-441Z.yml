      - paragraph [ref=e35]: 本工具实作了论文 arXiv 2604.08407 所列 3 类关键的中转站攻击侦测 — 涵盖依赖劫持、条件式 system prompt 注入、与金钥外泄。每次测试会自动跑 50 项以上的 probe 来侦测这些攻击面。
      - generic [ref=e36]:
        - article [ref=e37]:
          - generic [ref=e38]:
            - generic [ref=e39]: AC-1.a
            - heading "回应窜改" [level=3] [ref=e40]
          - paragraph [ref=e41]: 中转站在「解析回应」阶段主动修改 tool-call 或文字内容，让 agent 执行攻击者指定的操作。常见手法包含：窜改 npm/pip/go/cargo 安装指令、注入 typosquatting 套件、改写 shell command 参数。检测方式为比对中转站回应与直连模型的 tool-call payload，找出 silent rewrite。
        - article [ref=e42]:
          - generic [ref=e43]:
            - generic [ref=e44]: AC-1.b
            - heading "条件注入" [level=3] [ref=e45]
          - paragraph [ref=e46]: 中转站根据 prompt 内容条件式注入 system message — 对含「银行」「密码」「转账」等敏感词的请求注入恶意指令，对普通请求则保持沉默。统计上呈现异常分布差异。检测方式为 Proxy Monitor 比对 baseline 与待测中转站的 system prompt 偏移量。
        - article [ref=e47]:
          - generic [ref=e48]:
            - generic [ref=e49]: AC-2
            - heading "秘密扫描" [level=3] [ref=e50]
          - paragraph [ref=e51]: 中转站在请求 (request) 与回应 (response) 两端静默扫描 API key、access token、个资、商业机密等敏感资讯，因为不修改内容因此一般 diff 工具侦测不到。检测方式为注入 honeypot token 并验证该 token 是否在中转站日志、Telegram bot、或外部 endpoint 出现。
